<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <style>
    :root {
      --primary-color: #bb86fc;
      --background-color: #121212;
      --surface-color: #1e1e1e;
      --on-surface-color: #ffffff;
      --error-color: #cf6679;
    }
    body {
      background-color: var(--background-color);
      color: var(--on-surface-color);
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      line-height: 1.6;
    }
    h2 {
      color: var(--primary-color);
    }
    form, .blog-post {
      background-color: var(--surface-color);
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    label, input, textarea, button {
      display: block;
      width: 100%;
      margin-bottom: 15px;
    }
    input, textarea {
      background-color: #333333;
      border: 1px solid #444444;
      color: var(--on-surface-color);
      padding: 10px;
      border-radius: 4px;
      font-size: 16px;
    }
    button {
      background-color: var(--primary-color);
      border: none;
      color: #000000;
      padding: 10px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.3s ease;
    }
    button:hover {
      background-color: #9b59b6;
    }
    .blog-post h3 {
      color: var(--primary-color);
      margin-top: 0;
    }
    .blog-post button {
      background-color: var(--error-color);
      color: var(--on-surface-color);
    }
    .blog-post button:hover {
      background-color: #b4424f;
    }
    .separator {
      margin: 20px 0;
      border-top: 1px solid #333333;
    }
    .blog-post img {
      max-width: 100%;
      height: auto;
      margin-top: 10px;
      border-radius: 4px;
    }
    #imagePreview {
      max-width: 200px;
      max-height: 200px;
      margin-top: 10px;
    }
    @media (max-width: 600px) {
      body {
        padding: 10px;
      }
      form, .blog-post {
        padding: 15px;
      }
    }
  </style>
</head>
<body>
  <h2>Add New Blog Post</h2>
  <form id="blogForm">
    <label for="title">Title:</label>
    <input type="text" id="title" name="title" required>
    
    <label for="date">Date:</label>
    <input type="date" id="date" name="date" required>
    
    <label for="content">Content:</label>
    <textarea id="content" name="content" required rows="5"></textarea>
    
    <label for="image">Image:</label>
    <input type="file" id="image" name="image" accept="image/*">
    <img id="imagePreview" src="" alt="Image preview" style="display: none;">
    
    <button type="submit">Add Blog Post</button>
  </form>

  <h2>Blog Posts</h2>
  <div id="blogPostsContainer"></div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const blogForm = document.getElementById('blogForm');
      const blogPostsContainer = document.getElementById('blogPostsContainer');
      const imageInput = document.getElementById('image');
      const imagePreview = document.getElementById('imagePreview');

      imageInput.addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = function(e) {
            imagePreview.src = e.target.result;
            imagePreview.style.display = 'block';
          }
          reader.readAsDataURL(file);
        }
      });

      blogForm.addEventListener('submit', function(event) {
        event.preventDefault();
        const blogPost = createBlogPost();
        if (saveBlogPost(blogPost)) {
          alert('Blog post added successfully');
          blogForm.reset();
          imagePreview.src = '';
          imagePreview.style.display = 'none';
          renderBlogPosts();
        }
      });

      function createBlogPost() {
        return {
          id: Date.now(),
          title: document.getElementById('title').value.trim(),
          date: document.getElementById('date').value,
          content: document.getElementById('content').value.trim(),
          image: imagePreview.src
        };
      }

      function saveBlogPost(blogPost) {
        if (!blogPost.title || !blogPost.date || !blogPost.content) {
          alert('Please fill in all required fields');
          return false;
        }
        
        let blogPosts = getBlogPosts();
        if (!blogPosts.some(post => post.id === blogPost.id)) {
          blogPosts.push(blogPost);
          localStorage.setItem('blogPosts', JSON.stringify(blogPosts));
          return true;
        } else {
          alert('Duplicate blog post detected');
          return false;
        }
      }

      function getBlogPosts() {
        return JSON.parse(localStorage.getItem('blogPosts')) || [];
      }

      function renderBlogPosts() {
        blogPostsContainer.innerHTML = '';
        const blogPosts = getBlogPosts();
        blogPosts.forEach(post => {
          const postElement = document.createElement('div');
          postElement.className = 'blog-post';
          postElement.innerHTML = `
            <h3>${escapeHTML(post.title)}</h3>
            <p><strong>Date:</strong> ${post.date}</p>
            <p>${escapeHTML(post.content)}</p>
            ${post.image ? `<img src="${post.image}" alt="Blog post image">` : ''}
            <button onclick="deletePost(${post.id})">Delete</button>
          `;
          blogPostsContainer.appendChild(postElement);
        });
      }

      function escapeHTML(str) {
        return str.replace(/[&<>'"]/g, 
          tag => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            "'": '&#39;',
            '"': '&quot;'
          }[tag] || tag)
        );
      }

      window.deletePost = function(id) {
        if (confirm('Are you sure you want to delete this post?')) {
          let blogPosts = getBlogPosts();
          blogPosts = blogPosts.filter(post => post.id !== id);
          localStorage.setItem('blogPosts', JSON.stringify(blogPosts));
          renderBlogPosts();
        }
      };

      renderBlogPosts();
    });
  </script>
</body>
</html>
