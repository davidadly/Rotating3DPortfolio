<!DOCTYPE html>
<html lang="en">

<head>
  <!-- External script for page performance tracking or other functionalities -->
  <script src="/scripts/csi.min.js"></script>
  
  <!-- Metadata for character encoding and compatibility -->
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  
  <!-- Viewport settings for responsive design -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Favicons for different devices and platforms -->
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicons/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicons/favicon-16x16.png" />
  
  <!-- Manifest for web app settings and metadata -->
  <link rel="manifest" href="/assets/favicons/site.webmanifest" />
  
  <!-- Safari pinned tab icon with color customization -->
  <link rel="mask-icon" href="/assets/favicons/safari-pinned-tab.svg" color="#5bbad5" />
  
  <!-- Microsoft-specific tile color for Windows 8/10 -->
  <meta name="msapplication-TileColor" content="#da532c" />

  <!-- External stylesheets for font and icon styles -->
  <link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.6.1/css/font-awesome.min.css" type="text/css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,800" type="text/css" rel="stylesheet" />

  <!-- Internal stylesheets for page design -->
  <link rel="stylesheet" href="./styles/style.css" />
  <link rel="stylesheet" href="./styles/header.css" />
  <link rel="stylesheet" href="./styles/soundCloud.css" />
  <link rel="stylesheet" href="./styles/modern-player.css" />
  
  <!-- Page title -->
  <title>DXADLY - Modern Music Player</title>

  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: 'Open Sans', sans-serif;
    }
    .modern-player {
      margin: 0;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 30px;
      width: 350px;
    }
    .player-header {
      text-align: center;
      margin-bottom: 20px;
    }
    .album-art {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      margin-bottom: 20px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
    }
    .track-info {
      color: #fff;
    }
    .artist {
      font-size: 24px;
      font-weight: 600;
      margin: 0;
    }
    .song {
      font-size: 18px;
      margin: 5px 0 0;
      opacity: 0.8;
    }
    .progress-container {
      margin-bottom: 20px;
    }
    .progress-bar {
      height: 6px;
      background-color: rgba(255, 255, 255, 0.3);
      border-radius: 3px;
      overflow: hidden;
    }
    .progress {
      height: 100%;
      background-color: #fff;
      width: 0;
      transition: width 0.1s linear;
    }
    .time-info {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #fff;
      margin-top: 5px;
    }
    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
    }
    .control-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 24px;
      margin: 0 15px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .control-btn:hover {
      transform: scale(1.1);
    }
    .play-pause {
      font-size: 36px;
    }
    .volume-control {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
      color: #fff;
    }
    .volume-control i {
      margin-right: 10px;
    }
    #volumeSlider {
      flex-grow: 1;
      -webkit-appearance: none;
      height: 5px;
      border-radius: 2.5px;
      background: rgba(255, 255, 255, 0.3);
      outline: none;
    }
    #volumeSlider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
    }
    .playlist-toggle {
      background: none;
      border: none;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      margin-bottom: 10px;
    }
    .playlist {
      max-height: 200px;
      overflow-y: auto;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 10px;
    }
    .playlist.hidden {
      display: none;
    }
    #trackList {
      list-style-type: none;
      padding: 0;
      margin: 0;
    }
    #trackList li {
      padding: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease;
      color: #fff;
    }
    #trackList li:hover {
      background-color: rgba(255, 255, 255, 0.2);
    }
    #trackList li.active {
      font-weight: bold;
      background-color: rgba(255, 255, 255, 0.3);
    }
    .music-folder-dropdown {
      position: absolute;
      left: 20px;
      top: 20px;
    }
    .music-folder-toggle {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      padding: 5px 10px;
      border-radius: 5px;
    }
    .music-folder-list {
      position: absolute;
      top: 100%;
      left: 0;
      background-color: rgba(0, 0, 0, 0.8);
      border-radius: 5px;
      padding: 10px;
      max-height: 200px;
      overflow-y: auto;
      z-index: 1000;
    }
    .music-folder-list.hidden {
      display: none;
    }
    .music-folder-list div {
      padding: 5px;
      cursor: pointer;
      transition: background-color 0.2s ease;
      color: #fff;
    }
    .music-folder-list div:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }
  </style>
</head>

<body>
  <!-- Header section with site title and navigation -->
  <header>
    <div class="headline">
      <!-- Main site title linking to the homepage -->
      <h1><a href="/home.html">DXADLY</a></h1>
      <!-- Link to the portfolio page -->
      <h3><a href="/portfolio" target="_self"> PORTFOLIO </a></h3>
    </div>
    
    <!-- Navigation menu -->
    <nav>
      <a href="contact.html">CONTACT<a>
    </nav>
  </header>

  <!-- Modern Music Player Container -->
  <div class="modern-player">
    <!-- Album Art and Track Info -->
    <div class="player-header">
      <img id="albumArt" src="https://i1.sndcdn.com/artworks-000160121089-u63pt0-t500x500.jpg" alt="Album Art" class="album-art" />
      <div class="track-info">
        <h2 id="artistName" class="artist">I Am Karate</h2>
        <p id="songName" class="song">Bitter</p>
      </div>
    </div>

    <!-- Progress Bar -->
    <div class="progress-container">
      <div class="progress-bar">
        <div class="progress"></div>
      </div>
      <div class="time-info">
        <span id="currentTime">0:00</span>
        <span id="duration">0:00</span>
      </div>
    </div>

    <!-- Player Controls -->
    <div class="controls">
      <button class="control-btn previous"><i class="fa fa-step-backward"></i></button>
      <button class="control-btn play-pause"><i class="fa fa-play"></i></button>
      <button class="control-btn next"><i class="fa fa-step-forward"></i></button>
    </div>

    <!-- Volume Control -->
    <div class="volume-control">
      <i class="fa fa-volume-up"></i>
      <input type="range" id="volumeSlider" min="0" max="100" value="100">
    </div>

    <!-- Music Folder Dropdown -->
    <div class="music-folder-dropdown">
      <button id="musicFolderToggle" class="music-folder-toggle">
        <i class="fa fa-folder"></i> Music Folder
      </button>
      <div id="musicFolderList" class="music-folder-list hidden">
        <!-- This will be populated dynamically -->
      </div>
    </div>

    <!-- Playlist Toggle -->
    <button id="playlistToggle" class="playlist-toggle">
      <i class="fa fa-list"></i>
    </button>

    <!-- Playlist -->
    <div class="playlist hidden">
      <ul id="trackList"></ul>
    </div>

    <!-- HTML5 audio element -->
    <audio id="player"></audio>
  </div>

  <!-- External JavaScript libraries and scripts -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>
  <script src="./scripts/localMusicPlayer.js"></script>
</body>

</html>
