<!DOCTYPE html>
<html lang="en">

<head>
  <!-- External script for page performance tracking or other functionalities -->
  <script src="/scripts/csi.min.js"></script>
  
  <!-- Metadata for character encoding and compatibility -->
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  
  <!-- Viewport settings for responsive design -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Favicons for different devices and platforms -->
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicons/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicons/favicon-16x16.png" />
  
  <!-- Manifest for web app settings and metadata -->
  <link rel="manifest" href="/assets/favicons/site.webmanifest" />
  
  <!-- Safari pinned tab icon with color customization -->
  <link rel="mask-icon" href="/assets/favicons/safari-pinned-tab.svg" color="#5bbad5" />
  
  <!-- Microsoft-specific tile color for Windows 8/10 -->
  <meta name="msapplication-TileColor" content="#da532c" />

  <!-- External stylesheets for font and icon styles -->
  <link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.6.1/css/font-awesome.min.css" type="text/css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,800" type="text/css" rel="stylesheet" />

  <!-- Internal stylesheets for page design -->
  <link rel="stylesheet" href="./styles/style.css" />
  <link rel="stylesheet" href="./styles/header.css" />
  <link rel="stylesheet" href="./styles/soundCloud.css" />
  <link rel="stylesheet" href="./styles/modern-player.css" />
  
  <!-- Page title -->
  <title>DXADLY - Modern Music Player</title>

  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      background-color: #f0f0f0;
    }
    .modern-player {
      margin: 0;
    }
  </style>
</head>

<body>
  <!-- Header section with site title and navigation -->
  <header>
    <div class="headline">
      <!-- Main site title linking to the homepage -->
      <h1><a href="/home.html">DXADLY</a></h1>
      <!-- Link to the portfolio page -->
      <h3><a href="/portfolio" target="_self"> PORTFOLIO </a></h3>
    </div>
    
    <!-- Navigation menu -->
    <nav>
      <a href="contact.html">CONTACT<a>
    </nav>
  </header>

  <!-- Modern Music Player Container -->
  <div class="modern-player">
    <!-- Album Art and Track Info -->
    <div class="player-header">
      <img id="albumArt" src="https://i1.sndcdn.com/artworks-000160121089-u63pt0-t500x500.jpg" alt="Album Art" class="album-art" />
      <div class="track-info">
        <h2 id="artistName" class="artist">I Am Karate</h2>
        <p id="songName" class="song">Bitter</p>
      </div>
    </div>

    <!-- Progress Bar -->
    <div class="progress-container">
      <div class="progress-bar">
        <div class="progress"></div>
      </div>
      <div class="time-info">
        <span id="currentTime">0:00</span>
        <span id="duration">0:00</span>
      </div>
    </div>

    <!-- Player Controls -->
    <div class="controls">
      <button class="control-btn previous"><i class="fa fa-step-backward"></i></button>
      <button class="control-btn play-pause"><i class="fa fa-play"></i></button>
      <button class="control-btn next"><i class="fa fa-step-forward"></i></button>
    </div>

    <!-- Volume Control -->
    <div class="volume-control">
      <i class="fa fa-volume-up"></i>
      <input type="range" id="volumeSlider" min="0" max="100" value="100">
    </div>

    <!-- Playlist Toggle -->
    <button id="playlistToggle" class="playlist-toggle">
      <i class="fa fa-list"></i>
    </button>

    <!-- Playlist -->
    <div class="playlist hidden">
      <ul id="trackList"></ul>
    </div>

    <!-- HTML5 audio element -->
    <audio id="player"></audio>
  </div>

  <!-- External JavaScript libraries and scripts -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>
  <script src="./scripts/localMusicPlayer.js"></script>
</body>

</html>
