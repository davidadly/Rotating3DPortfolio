<!DOCTYPE html>
<html lang="en">

<head>
  <!-- External script for page performance tracking or other functionalities -->
  <script src="/scripts/csi.min.js"></script>
  
  <!-- Metadata for character encoding and compatibility -->
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  
  <!-- Viewport settings for responsive design -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Favicons for different devices and platforms -->
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicons/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicons/favicon-16x16.png" />
  
  <!-- Manifest for web app settings and metadata -->
  <link rel="manifest" href="/assets/favicons/site.webmanifest" />
  
  <!-- Safari pinned tab icon with color customization -->
  <link rel="mask-icon" href="/assets/favicons/safari-pinned-tab.svg" color="#5bbad5" />
  
  <!-- Microsoft-specific tile color for Windows 8/10 -->
  <meta name="msapplication-TileColor" content="#da532c" />

  <!-- External stylesheets for font and icon styles -->
  <link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.6.1/css/font-awesome.min.css" type="text/css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,800" type="text/css" rel="stylesheet" />

  <!-- Internal stylesheets for page design -->
  <link rel="stylesheet" href="./styles/style.css" />
  <link rel="stylesheet" href="./styles/header.css" />
  <link rel="stylesheet" href="./styles/soundCloud.css" />
  
  <!-- Page title -->
  <title>DXADLY</title>
</head>

<body>
  <!-- Header section with site title and navigation -->
  <header>
    <div class="headline">
      <!-- Main site title linking to the homepage -->
      <h1><a href="/home.html">DXADLY</a></h1>
      <!-- Link to the portfolio page -->
      <h3><a href="/portfolio" target="_self"> PORTFOLIO </a></h3>
    </div>
    
    <!-- Navigation menu -->
    <nav>
      <a href="contact.html">CONTACT<a>
    </nav>
  </header>

  <!-- Music player container -->
  <div class="player music-player__con">
    <!-- Play button -->
    <div class="button play">
      <i aria-hidden="true" class="fa fa-play"></i><i aria-hidden="true" class="fa fa-pause"></i>
    </div>
    
    <!-- Menu button -->
    <div class="button bottom">
      <i aria-hidden="true" class="fa fa-bars"></i>
    </div>
    
    <!-- Next track button -->
    <div class="button next">
      <i aria-hidden="true" class="fa fa-forward"></i>
    </div>
    
    <!-- Previous track button -->
    <div class="button previous">
      <i aria-hidden="true" class="fa fa-backward"></i>
    </div>
    
    <!-- SoundCloud icon -->
    <i class="fa fa-soundcloud" aria-hidden="true"></i>
    
    <!-- Track list -->
    <div class="list">
      <ul></ul>
    </div>
    
    <!-- Player controller section -->
    <div class="controller">
      <!-- Repeat of previous button (likely for another part of the interface) -->
      <div class="button previous">
        <i aria-hidden="true" class="fa fa-backward"></i>
      </div>
      
      <!-- Repeat of play button -->
      <div class="button play">
        <i aria-hidden="true" class="fa fa-play"></i><i aria-hidden="true" class="fa fa-pause"></i>
      </div>
      
      <!-- Repeat of next button -->
      <div class="button next">
        <i aria-hidden="true" class="fa fa-forward"></i>
      </div>
      
      <!-- Close button for the player -->
      <div class="button close">
        <i aria-hidden="true" class="fa fa-close"></i>
      </div>
      
      <!-- Progress bar with waveform background -->
      <div class="progress-bar">
        <span class="progress"></span>
        <div class="wave" style="
              background-image: url('https://w1.sndcdn.com/8vvxygw3jJov_m.png');
            "></div>
      </div>
      
      <!-- Track information display -->
      <div class="info-content">
        <!-- Album artwork -->
        <img src="https://i1.sndcdn.com/artworks-000160121089-u63pt0-t500x500.jpg" />
        
        <!-- Artist and song information -->
        <div class="info">
          <h2 class="artist">I Am Karate</h2>
          <p class="song">Bitter</p>
        </div>
      </div>
    </div>
    
    <!-- Another progress bar, possibly for a different element -->
    <div class="progress-bar"><span class="progress"></span></div>
    
    <!-- HTML5 audio element -->
    <audio id="player"></audio>
  </div>

  <!-- External JavaScript libraries and scripts -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>
  <script type="module" src="./scripts/localMusicPlayer.js"></script>
</body>

</html>
