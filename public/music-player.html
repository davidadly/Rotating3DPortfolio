<!DOCTYPE html>
<html lang="en">

<head>
  <!-- External script for page performance tracking or other functionalities -->
  <script src="/scripts/csi.min.js"></script>
  
  <!-- Metadata for character encoding and compatibility -->
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  
  <!-- Viewport settings for responsive design -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Favicons for different devices and platforms -->
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicons/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicons/favicon-16x16.png" />
  
  <!-- Manifest for web app settings and metadata -->
  <link rel="manifest" href="/assets/favicons/site.webmanifest" />
  
  <!-- Safari pinned tab icon with color customization -->
  <link rel="mask-icon" href="/assets/favicons/safari-pinned-tab.svg" color="#5bbad5" />
  
  <!-- Microsoft-specific tile color for Windows 8/10 -->
  <meta name="msapplication-TileColor" content="#da532c" />

  <!-- External stylesheets for font and icon styles -->
  <link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.6.1/css/font-awesome.min.css" type="text/css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css?family=Fira+Code:400,700&display=swap" rel="stylesheet">

  <!-- Internal stylesheets for page design -->
  <link rel="stylesheet" href="./styles/style.css" />
  <link rel="stylesheet" href="./styles/header.css" />
  <link rel="stylesheet" href="./styles/soundCloud.css" />
  <link rel="stylesheet" href="./styles/modern-player.css" />
  
  <!-- Page title -->
  <title>David Adly Portfolio - Modern Music Player</title>

  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: 'Fira Code', monospace;
    }
    .content-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 1200px;
    }
    header {
      width: 100%;
      background-color: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 20px 0;
      margin-bottom: 30px;
    }
    .headline {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }
    .headline h1, .headline h3 {
      margin: 0;
      text-align: center;
    }
    nav {
      display: flex;
      justify-content: center;
      padding-top: 10px;
    }
    nav a {
      color: #fff;
      text-decoration: none;
      padding: 5px 10px;
      transition: background-color 0.3s ease;
    }
    nav a:hover {
      background-color: rgba(255, 255, 255, 0.2);
      border-radius: 5px;
    }
    .modern-player {
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 30px;
      width: 90%;
      max-width: 350px;
    }
    @media (max-width: 1024px) {
      .content-wrapper {
        width: 95%;
      }
      .modern-player {
        max-width: 400px;
      }
    }
    @media (max-width: 768px) {
      body {
        padding: 20px 0;
      }
      .content-wrapper {
        width: 90%;
      }
      .modern-player {
        width: 100%;
        max-width: none;
        padding: 20px;
      }
      .album-art {
        width: 180px;
        height: 180px;
      }
      .artist {
        font-size: 22px;
      }
      .song {
        font-size: 18px;
      }
      .control-btn {
        font-size: 22px;
        margin: 0 12px;
      }
      .play-pause {
        font-size: 32px;
      }
      .music-folder-dropdown {
        position: static;
        margin-bottom: 20px;
      }
    }
    @media (max-width: 480px) {
      body {
        padding: 10px 0;
      }
      .content-wrapper {
        width: 95%;
      }
      .headline {
        gap: 5px;
      }
      .headline h1 {
        font-size: 22px;
      }
      .headline h3 {
        font-size: 16px;
      }
      .modern-player {
        padding: 15px;
      }
      .album-art {
        width: 140px;
        height: 140px;
      }
      .artist {
        font-size: 20px;
      }
      .song {
        font-size: 16px;
      }
      .control-btn {
        font-size: 20px;
        margin: 0 8px;
      }
      .play-pause {
        font-size: 28px;
      }
      .volume-control {
        flex-direction: column;
        align-items: stretch;
      }
      .volume-control i {
        margin-right: 0;
        margin-bottom: 5px;
      }
      #volumeSlider {
        width: 100%;
      }
    }
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 250px;
      height: 100%;
      background-color: rgba(240, 248, 255, 0.2);
      backdrop-filter: blur(10px);
      box-shadow: 2px 0 5px rgba(0,0,0,0.1);
      z-index: 1000;
      transition: transform 0.3s ease-in-out;
    }
    .sidebar ul {
      list-style-type: none;
      padding: 0;
      margin-top: 60px;
    }
    .sidebar ul li {
      margin: 20px 0;
    }
    .sidebar ul li a {
      color: #4a4a4a;
      text-decoration: none;
      font-weight: bold;
      padding: 10px;
      display: block;
      transition: all 0.3s ease;
      border-radius: 5px;
      font-size: 1.1em;
    }
    .sidebar ul li a:hover {
      background-color: #e6f2ff;
      color: #3498db;
      transform: translateX(5px);
    }
    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(-100%);
      }
    }
    .player-header {
      text-align: center;
      margin-bottom: 20px;
    }
    .album-art {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      margin-bottom: 20px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
      background-color: rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .album-art i {
      font-size: 100px;
      color: #fff;
    }
    .track-info {
      color: #fff;
    }
    .artist {
      font-size: 24px;
      font-weight: 600;
      margin: 0;
    }
    .song {
      font-size: 18px;
      margin: 5px 0 0;
      opacity: 0.8;
    }
    .album {
      font-size: 14px;
      margin: 5px 0 0;
      opacity: 0.6;
    }
    .progress-container {
      margin-bottom: 20px;
    }
    .progress-bar {
      height: 10px;
      background-color: rgba(255, 255, 255, 0.3);
      border-radius: 5px;
      overflow: hidden;
    }
    .progress {
      height: 100%;
      background: linear-gradient(90deg, #667eea, #764ba2);
      width: 0;
      transition: width 0.1s linear;
    }
    .time-info {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #fff;
      margin-top: 5px;
    }
    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
    }
    .control-btn {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: #fff;
      font-size: 24px;
      margin: 0 15px;
      cursor: pointer;
      transition: all 0.3s ease;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }
    .control-btn::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: width 0.3s ease, height 0.3s ease;
    }
    .control-btn:hover::before {
      width: 150%;
      height: 150%;
    }
    .control-btn:hover {
      transform: scale(1.1);
    }
    .control-btn i {
      position: relative;
      z-index: 1;
    }
    .play-pause {
      font-size: 36px;
      width: 60px;
      height: 60px;
    }
    .play-pause:hover::before {
      background: rgba(255, 255, 255, 0.4);
    }
    .volume-control {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
      color: #fff;
    }
    .volume-control i {
      margin-right: 10px;
    }
    #volumeSlider {
      flex-grow: 1;
      -webkit-appearance: none;
      height: 5px;
      border-radius: 2.5px;
      background: rgba(255, 255, 255, 0.3);
      outline: none;
      position: relative;
    }
    #volumeSlider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      box-shadow: 0 0 5px rgba(0, 0, 0, 0.3);
    }
    #volumeSlider::-moz-range-thumb {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      box-shadow: 0 0 5px rgba(0, 0, 0, 0.3);
      border: none;
    }
    #volumeSlider::before {
      content: attr(data-volume);
      position: absolute;
      top: -25px;
      left: var(--thumb-position, 0);
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 12px;
      opacity: 0;
      transition: opacity 0.2s;
    }
    #volumeSlider:hover::before {
      opacity: 1;
    }
    .playlist-toggle {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      margin-bottom: 10px;
      padding: 10px;
      border-radius: 25px;
      transition: all 0.3s ease;
    }
    .playlist-toggle:hover {
      background: rgba(255, 255, 255, 0.3);
    }
    .playlist {
      max-height: 200px;
      overflow-y: auto;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 10px;
    }
    .playlist.hidden {
      display: none;
    }
    #trackList {
      list-style-type: none;
      padding: 0;
      margin: 0;
    }
    #trackList li {
      padding: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease;
      color: #fff;
    }
    #trackList li:hover {
      background-color: rgba(255, 255, 255, 0.2);
    }
    #trackList li.active {
      font-weight: bold;
      background-color: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>

<body>
  <!-- Header section with site title and navigation -->
  <header>
    <div class="headline">
      <!-- Main site title linking to the homepage -->
      <h1><a href="/home.html" style="color: #333; text-shadow: 1px 1px 2px rgba(255,255,255,0.5);">David Adly Portfolio</a></h1>
      <!-- Link to the portfolio page -->
      <h3><a href="/home.html" target="_self" style="color: #444;"> PORTFOLIO </a></h3>
    </div>
    
    <!-- Navigation menu -->
    <nav>
      <a href="contact.html">CONTACT<a>
    </nav>
  </header>

  <!-- Sidebar -->
  <div class="sidebar">
    <div id="sidebar-orb-container"></div>
    <ul>
      <li><a href="/home.html" style="color: #333;"><i class="fa fa-home"></i> Home</a></li>
      <li><a href="/home.html"><i class="fa fa-briefcase"></i> Home</a></li>
      <li><a href="/about.html"><i class="fa fa-user"></i> About</a></li>
      <li><a href="/contact.html"><i class="fa fa-envelope"></i> Contact</a></li>
      <li><a href="/blog.html"><i class="fa fa-pencil"></i> Blog</a></li>
    </ul>
  </div>

  <!-- Content wrapper -->
  <div class="content-wrapper">
    <h2 style="color: #fff; text-align: center; margin-bottom: 20px;">Music Player By David Adly</h2>
    <!-- Modern Music Player Container -->
    <div class="modern-player">
      <!-- Album Art and Track Info -->
      <div class="player-header">
      <div id="albumArt" class="album-art">
        <i class="fa fa-music"></i>
      </div>
      <div class="track-info">
        <h2 id="artistName" class="artist">Original by David Adly</h2>
        <p id="songName" class="song">Loading...</p>
      </div>
    </div>

    <!-- Progress Bar -->
    <div class="progress-container">
      <div class="progress-bar" id="progressBar">
        <div class="progress"></div>
      </div>
      <div class="time-info">
        <span id="currentTime">0:00</span>
        <span id="duration">0:00</span>
      </div>
    </div>

    <!-- Player Controls -->
    <div class="controls">
      <button class="control-btn previous"><i class="fa fa-step-backward"></i></button>
      <button class="control-btn play-pause"><i class="fa fa-play"></i></button>
      <button class="control-btn next"><i class="fa fa-step-forward"></i></button>
    </div>

    <!-- Volume Control -->
    <div class="volume-control">
      <i class="fa fa-volume-up"></i>
      <input type="range" id="volumeSlider" min="0" max="100" value="100">
    </div>



    <!-- HTML5 audio element -->
    <audio id="player"></audio>
  </div>
  </div> <!-- Close content-wrapper -->

  <!-- Footer -->
  <footer>
    <p>Music Player v1.0 | <a href="/home.html">Home</a> | <a href="/contact.html">Contact</a></p>
  </footer>

  <!-- External JavaScript libraries and scripts -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>
  <script src="/scripts/folderMusicPlayer.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // Sidebar Orb
    const sidebarScene = new THREE.Scene();
    const sidebarCamera = new THREE.PerspectiveCamera(75, 1, 0.1, 1000);
    const sidebarRenderer = new THREE.WebGLRenderer({ alpha: true });
    sidebarRenderer.setSize(200, 200);
    document.getElementById('sidebar-orb-container').appendChild(sidebarRenderer.domElement);

    const sidebarGeometry = new THREE.IcosahedronGeometry(1.5, 1);
    const sidebarMaterial = new THREE.MeshBasicMaterial({ color: 0x87ceeb, wireframe: true });
    const sidebarSphere = new THREE.Mesh(sidebarGeometry, sidebarMaterial);
    sidebarScene.add(sidebarSphere);

    sidebarCamera.position.z = 3;

    function animateSidebarOrb() {
      requestAnimationFrame(animateSidebarOrb);
      sidebarSphere.rotation.x += 0.01;
      sidebarSphere.rotation.y += 0.01;
      sidebarRenderer.render(sidebarScene, sidebarCamera);
    }
    animateSidebarOrb();

    // Interactive progress bar
    document.addEventListener('DOMContentLoaded', () => {
      const audioPlayer = document.getElementById('player');
      const progressBar = document.getElementById('progressBar');
      const progress = progressBar.querySelector('.progress');

      progressBar.addEventListener('click', (e) => {
        const rect = progressBar.getBoundingClientRect();
        const clickPosition = (e.clientX - rect.left) / rect.width;
        const newTime = clickPosition * audioPlayer.duration;
        audioPlayer.currentTime = newTime;
        progress.style.width = `${clickPosition * 100}%`;
      });

      audioPlayer.addEventListener('timeupdate', () => {
        const progressPercentage = (audioPlayer.currentTime / audioPlayer.duration) * 100;
        progress.style.width = `${progressPercentage}%`;
      });
    });
  </script>
</body>

</html>
