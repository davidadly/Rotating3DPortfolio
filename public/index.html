<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Load a minified JavaScript file -->
    <script src="/scripts/csi.min.js"></script>
    
    <!-- Set the character encoding for the document -->
    <meta charset="UTF-8" />
    
    <!-- Ensure the document is rendered in the highest mode supported by the browser -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    
    <!-- Make the page responsive on all devices by setting the viewport properties -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Redirect the user to the home.html page immediately after loading this document -->
    <script>
      window.location = "home.html";
    </script>

    <!-- Favicon links for different devices and sizes -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/favicons/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/favicons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/assets/favicons/favicon-16x16.png"
    />

    <!-- Link to the website manifest file -->
    <link rel="manifest" href="/assets/favicons/site.webmanifest" />
    
    <!-- Favicon for Safari pinned tabs -->
    <link
      rel="mask-icon"
      href="/assets/favicons/safari-pinned-tab.svg"
      color="#5bbad5"
    />
    
    <!-- Set the tile color for Windows tiles -->
    <meta name="msapplication-TileColor" content="#da532c" />

    <!-- External CSS link for Font Awesome icons -->
    <link
      href="https://maxcdn.bootstrapcdn.com/font-awesome/4.6.1/css/font-awesome.min.css"
      type="text/css"
      rel="stylesheet"
    />
    
    <!-- External CSS link for Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css?family=Open+Sans:300,800"
      type="text/css"
      rel="stylesheet"
    />
    
    <!-- Page title -->
    <title>DXADLY</title>

    <!-- Internal CSS styles -->
    <style>
      /* Reset default padding, margin, and set box-sizing */
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
        font-family: "Comic Sans MS", "Comic Sans", cursive;
      }

      /* Style the body element */
      body {
        font-family: "Comic Sans MS", "Comic Sans", cursive;
        overflow-x: hidden;
        height: 90vh;
        display: grid;
        place-items: center;
      }

      /* Center text for certain elements */
      h1,
      video,
      a,
      button {
        text-align: center;
      }

      /* Add margin to the h1 element */
      h1 {
        margin-top: 1rem;
      }

      /* Set the maximum width and height for the video element */
      video {
        max-width: 70%;
        max-height: 80vh;
        margin: 2rem auto;
        display: block;
      }

      /* Style the anchor tag containing the button */
      a {
        display: block;
        margin: 0 auto;
      }

      /* Style the button element */
      button {
        font-size: 1rem;
        width: 150px;
        height: 70px;
        padding: 1rem;
        color: white;
        background: none;
        animation: blink 1s linear infinite;
        cursor: pointer;
      }

      /* Keyframe animation for the button blinking effect */
      @keyframes blink {
        from {
          background-color: rgb(245, 12, 12);
          font-size: 90%;
        }
        to {
          background-color: rgb(92, 8, 8);
          font-size: 120%;
        }
      }
    </style>
  </head>

  <body>
    <!-- Main heading of the page -->
    <h1>adlyd</h1>

    <!-- Container for the video element -->
    <div class="video-con"></div>

    <!-- Button that redirects to the home page -->
    <a href="/home.html"><button>ENTER</button></a>

    <!-- JavaScript to fetch and display the current feature video -->
    <script>
      function getCurrentFeatureVideo() {
        let el = document.querySelector(".video-con");
        
        return fetch("/feature-video")
          .then((res) => res.json())
          .then((resJson) => {
            if (resJson.filename) {
              const url = `/assets/feature-videos/${resJson.filename}`;
              el.innerHTML = `<video src="${url}" autoplay controls muted></video>`;
            }
          })
          .catch((err) => console.error(err));
      }

      // Call the function to load the video when the page loads
      getCurrentFeatureVideo();
    </script>
  </body>
</html>
